<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>心雨少儿体能-体测方向 · 短跑总表</title>
    <link rel="stylesheet" href="../../css/app.css?v=14" />
  </head>
  <body data-page="sprint-index">
    <header class="app-header">
      <div>
        <h1>心雨少儿体能-体测方向 · 短跑总表</h1>
        <div class="sub">12课时训练计划 · 适用 2–6年级 · 单课 45分钟</div>
      </div>
      <div class="header-right">
        <div class="header-aside no-print">
          <figure class="header-qr">
            <img src="../../assets/readme/author-qr.jpg" alt="作者微信二维码" />
            <figcaption>我的二维码</figcaption>
          </figure>
          <figure class="header-qr donate">
            <img src="../../assets/readme/donate-qr.jpg" alt="打赏二维码" />
            <figcaption>打赏二维码</figcaption>
          </figure>
          <a
            class="header-github"
            href="https://github.com/XiaoyYuChen/TrainHub"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 4.77c.68.003 1.36.092 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
              />
            </svg>
            GitHub 仓库
          </a>
        </div>
        <div class="nav-links no-print">
          <a class="btn" href="../../index.html">返回首页</a>
          <button type="button" class="btn btn-primary" id="btn-print">打印总表</button>
          <button type="button" class="btn btn-coach" id="btn-image">保存图片</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="panel no-print">
        <p class="note" style="margin: 0">
          每课分<strong>学员版</strong>（训练项 + 掌握情况，可填写保存）与<strong>教练员版</strong>（教案：核心点、常见错误与纠错）。点击对应按钮进入。打印 / 保存图片仅输出下方总表内容。
        </p>
      </div>

      <div class="table-wrap" id="print-area">
        <table class="plan-table">
          <thead>
            <tr>
              <th style="width: 4em">课次</th>
              <th>主题</th>
              <th>重点动作</th>
              <th>目标</th>
              <th class="no-print" style="width: 15em; white-space: nowrap">进入</th>
            </tr>
          </thead>
          <tbody id="lesson-tbody"></tbody>
        </table>
      </div>
    </main>

    <script src="../../data/sprint/data.js"></script>
    <script src="../../js/export-image.js?v=8"></script>
    <script src="../../js/app.js?v=19"></script>
  </body>
</html>
