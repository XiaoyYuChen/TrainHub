<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>心雨少儿体能-体测方向 · 核心力量总表</title>
    <link rel="stylesheet" href="../../css/app.css?v=14" />
  </head>
  <body data-page="module-index">
    <header class="app-header">
      <div>
        <h1>心雨少儿体能-体测方向 · 核心力量总表</h1>
        <div class="sub">A / S / SS 三档 · 3–4 组金字塔 · 单课 45分钟</div>
      </div>
      <div class="nav-links no-print">
        <a class="btn" href="../../index.html">返回首页</a>
        <button type="button" class="btn btn-primary" id="btn-print">打印总表</button>
        <button type="button" class="btn btn-coach" id="btn-image">保存图片</button>
      </div>
    </header>

    <main class="container">
      <div class="panel no-print">
        <p class="note" style="margin: 0">
          三档：<strong>A</strong> 1–3年级、<strong>S</strong> 4–5年级、<strong>SS</strong> 6年级+。
          每项 <strong>3–4 组</strong>：A/S 推荐 <strong>15–20–15</strong> 或 <strong>15–20–25–20</strong>；
          SS 推荐 <strong>20–25–20</strong> 或 <strong>20–25–25–20</strong>（爬行/箭步走用步）。
          <strong>平板支撑按秒</strong>：入门 <strong>30 秒</strong>，每档递增 <strong>15 秒</strong>（A 30s / S 45s / SS 60s）。
          每课分<strong>学员版</strong>与<strong>教练员版</strong>。打印 / 保存图片仅输出下方总表。
        </p>
      </div>

      <div class="table-wrap" id="print-area">
        <table class="plan-table">
          <thead>
            <tr>
              <th style="width: 4em">级别</th>
              <th>主题</th>
              <th>训练动作</th>
              <th>目标</th>
              <th class="no-print" style="width: 15em; white-space: nowrap">进入</th>
            </tr>
          </thead>
          <tbody id="lesson-tbody"></tbody>
        </table>
      </div>
    </main>

    <script src="data.js?v=11"></script>
    <script src="../../js/export-image.js?v=8"></script>
    <script src="../../js/app.js?v=18"></script>
  </body>
</html>
