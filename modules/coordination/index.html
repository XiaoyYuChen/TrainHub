<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>心雨少儿体能-体测方向 · 协调性总表</title>
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body data-page="module-index">
    <header class="app-header">
      <div>
        <h1>心雨少儿体能-体测方向 · 协调性总表</h1>
        <div class="sub">1课时 · 适用 1–6年级 · 单课 45分钟 · 徒手八项</div>
      </div>
      <div class="nav-links no-print">
        <a class="btn" href="../../index.html">返回首页</a>
        <button type="button" class="btn btn-primary" id="btn-print">打印总表</button>
        <button type="button" class="btn btn-coach" id="btn-image">保存图片</button>
      </div>
    </header>

    <main class="container">
      <div class="panel no-print">
        <p class="note" style="margin: 0">
          专项 8 项：<strong>转髋跳、胯下击掌、开合跳、前后摸脚、垫步扩胸、垫步提膝碰肘、垫步绕臂、蝎子摆尾</strong>。
          每课分<strong>学员版</strong>（训练项 + 掌握情况，可填写保存）与<strong>教练员版</strong>（教案：核心点、常见错误与纠错）。
          打印 / 保存图片仅输出下方总表内容。
        </p>
      </div>

      <div class="table-wrap" id="print-area">
        <table class="plan-table">
          <thead>
            <tr>
              <th style="width: 4em">课次</th>
              <th>主题</th>
              <th>训练动作</th>
              <th>目标</th>
              <th class="no-print" style="width: 15em; white-space: nowrap">进入</th>
            </tr>
          </thead>
          <tbody id="lesson-tbody"></tbody>
        </table>
      </div>
    </main>

    <script src="data.js?v=4"></script>
    <script src="../../js/export-image.js?v=7"></script>
    <script src="../../js/app.js?v=17"></script>
  </body>
</html>
