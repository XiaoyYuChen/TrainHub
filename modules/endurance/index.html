<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>心雨少儿体能-体测方向 · 长跑总表</title>
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body data-page="endurance-index">
    <header class="app-header">
      <div>
        <h1>心雨少儿体能-体测方向 · 长跑总表</h1>
        <div class="sub">15课时训练计划 · 适用 2–6年级 · 单课 45–70分钟（按课次）</div>
      </div>
      <div class="nav-links no-print">
        <a class="btn" href="../../index.html">返回首页</a>
        <button type="button" class="btn btn-primary" id="btn-print">打印总表</button>
        <button type="button" class="btn btn-coach" id="btn-image">保存图片</button>
      </div>
    </header>

    <main class="container">
      <div class="panel no-print">
        <p class="note" style="margin: 0">
          含长跑与短跑区别、呼吸节奏、小学体测<strong>50米×8往返跑</strong>（转弯与体力分配）、3–5公里持续跑。
          每课分<strong>学员版</strong>与<strong>教练员版</strong>。打印 / 保存图片仅输出下方总表内容。
        </p>
      </div>

      <div class="table-wrap" id="print-area">
        <table class="plan-table">
          <thead>
            <tr>
              <th style="width: 4em">课次</th>
              <th>主题</th>
              <th style="width: 4em">时长</th>
              <th>重点动作</th>
              <th>目标</th>
              <th class="no-print" style="width: 15em; white-space: nowrap">进入</th>
            </tr>
          </thead>
          <tbody id="lesson-tbody"></tbody>
        </table>
      </div>
    </main>

    <script src="data.js"></script>
    <script src="../../js/export-image.js?v=7"></script>
    <script src="../../js/app.js?v=9"></script>
  </body>
</html>
