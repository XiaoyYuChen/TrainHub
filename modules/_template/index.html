<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>心雨少儿体能-体测方向 · 示例专项总表</title>
    <link rel="stylesheet" href="../../css/app.css?v=14" />
  </head>
  <!--
    复制本文件夹为 modules/{id}/
    把下面的 data/_template 改成 data/{id}
    并在 data/catalog.js 登记
  -->
  <body data-page="module-index">
    <header class="app-header">
      <div>
        <h1>心雨少儿体能-体测方向 · 示例专项总表</h1>
        <div class="sub">复制本页即可扩展新的专项训练模块</div>
      </div>
      <div class="nav-links no-print">
        <a class="btn" href="../../index.html">返回首页</a>
        <button type="button" class="btn btn-primary" id="btn-print">打印总表</button>
        <button type="button" class="btn btn-coach" id="btn-image">保存图片</button>
      </div>
    </header>

    <main class="container">
      <div class="panel no-print">
        <p class="note" style="margin: 0">
          这是给贡献者用的空壳示例。每课分<strong>学员版</strong>与<strong>教练员版</strong>。
          打印 / 保存图片仅输出下方总表。扩展步骤见仓库根目录 <code>AGENTS.md</code>。
        </p>
      </div>

      <div class="table-wrap" id="print-area">
        <table class="plan-table">
          <thead>
            <tr>
              <th style="width: 4em">课次</th>
              <th>主题</th>
              <th>重点动作</th>
              <th>目标</th>
              <th class="no-print" style="width: 15em; white-space: nowrap">进入</th>
            </tr>
          </thead>
          <tbody id="lesson-tbody"></tbody>
        </table>
      </div>
    </main>

    <script src="../../data/_template/data.js"></script>
    <script src="../../js/export-image.js?v=8"></script>
    <script src="../../js/app.js?v=19"></script>
  </body>
</html>
