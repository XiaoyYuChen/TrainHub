<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小学生专项训练营</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="app-header no-print">
      <div>
        <h1>小学生专项训练营</h1>
        <div class="sub">2–6年级 · 入门训练 · 学员版 / 教练员版可打印</div>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h2>选择训练模块</h2>
        <p>
          先完成「短跑」12 课时入门。每课提供学员训练表与教练员教案两套材料，均可打印。
        </p>
      </section>

      <div class="module-grid">
        <a class="module-card" href="modules/sprint/index.html">
          <span class="badge">可用</span>
          <h3>短跑</h3>
          <p>12 课时入门：摆臂、步频、抬腿、起跑与途中跑衔接</p>
        </a>
        <a class="module-card disabled" href="modules/endurance/index.html">
          <span class="badge soon">即将开放</span>
          <h3>长跑</h3>
          <p>后续按同样结构扩展：总表 + 学员版 / 教练员版</p>
        </a>
        <a class="module-card disabled" href="modules/jump-rope/index.html">
          <span class="badge soon">即将开放</span>
          <h3>跳绳</h3>
          <p>后续按同样结构扩展：总表 + 学员版 / 教练员版</p>
        </a>
        <a class="module-card disabled" href="modules/fitness/index.html">
          <span class="badge soon">即将开放</span>
          <h3>体能</h3>
          <p>后续按同样结构扩展：总表 + 学员版 / 教练员版</p>
        </a>
        <a class="module-card disabled" href="modules/core/index.html">
          <span class="badge soon">即将开放</span>
          <h3>核心力量</h3>
          <p>后续按同样结构扩展：总表 + 学员版 / 教练员版</p>
        </a>
      </div>
    </main>
  </body>
</html>
